[package]
name = "ssdrsync"
version = "0.1.0"
edition = "2021"
description = "Super-fast file sync tool optimized for large files on Linux"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
blake3 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync", "macros"] }
nix = { version = "0.29", features = ["fs"] }
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
filetime = "0.2"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
